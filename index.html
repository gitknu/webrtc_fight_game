<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pixel Brawler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- Libraries -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
<!-- Audio: Tone.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

<style>
    :root {
        --bg-color: #111;
        --ui-bg: #fff;
        --p1-color: #2e7d32;
        --p2-color: #c62828;
        --accent: #0b5394;
        --shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    * { box-sizing: border-box; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; }

    body {
        margin: 0; padding: 0;
        background-color: var(--bg-color);
        color: black;
        font-family: 'Montserrat', sans-serif;
        height: 100dvh; width: 100%;
        overflow: hidden; 
        display: flex; flex-direction: column; 
    }

    /* --- UI LAYERS --- */
    #ui-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, #222 0%, #111 100%); 
        z-index: 200;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 10px;
    }
    
    #btn-offline {
        position: absolute; top: 15px; right: 15px;
        background: #444; color: #fff; border: 1px solid #666;
        padding: 8px 12px; border-radius: 8px; font-weight: 700;
        font-size: 0.8rem; cursor: pointer; z-index: 300;
        display: flex; align-items: center; gap: 6px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        transition: all 0.2s;
    }
    #btn-offline:active { transform: scale(0.95); background: #666; }

    .card {
        background: var(--ui-bg); padding: 1.5rem; border-radius: 1.5rem;
        text-align: center; width: 100%; max-width: 400px;
        box-shadow: var(--shadow); border: none;
        display: flex; flex-direction: column; gap: 15px; align-items: center;
        max-height: 95vh; overflow-y: auto;
    }
    
    .hidden { display: none !important; }

    /* Role Buttons */
    .role-btn {
        width: 100%; padding: 25px; border: none; border-radius: 1rem;
        font-family: inherit; font-size: 1.4rem; font-weight: 900; color: white;
        cursor: pointer; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        transition: transform 0.1s, filter 0.1s;
        text-transform: uppercase;
    }
    .role-btn:active { transform: scale(0.96); filter: brightness(1.1); }
    .role-host { background: linear-gradient(135deg, #2e7d32, #1b5e20); }
    .role-join { background: linear-gradient(135deg, #c62828, #b71c1c); }

    /* Lock Interface */
    #lock-container {
        display: flex; justify-content: center; gap: 5px; margin: 10px 0; perspective: 500px;
    }
    .lock-roller {
        width: 40px; height: 60px; background: #f0f0f0; border-bottom: 4px solid #ccc;
        border-radius: 8px; font-size: 2rem; font-weight: 800; color: #333;
        display: flex; align-items: center; justify-content: center;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); cursor: grab;
    }
    .btn-primary {
        background: var(--accent); color: white; border: none; padding: 15px;
        border-radius: 12px; font-weight: 800; width: 100%; font-size: 1.1rem;
        cursor: pointer; text-transform: uppercase;
        display: flex; align-items: center; justify-content: center; gap: 8px;
        box-shadow: 0 4px 10px rgba(11, 83, 148, 0.4);
    }
    .btn-secondary {
        background: #eee; color: #333; border: none; padding: 12px;
        border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer;
        display: flex; align-items: center; justify-content: center; gap: 6px;
    }

    /* --- GAME UI --- */
    #game-layer {
        display: flex; flex-direction: column; height: 100%; width: 100%;
        position: relative;
    }

    #hud {
        height: 70px; background: linear-gradient(to bottom, #222, #111); display: flex; align-items: center; 
        padding: 0 15px; gap: 15px; border-bottom: 4px solid #000; z-index: 20;
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .hp-box { flex: 1; display: flex; flex-direction: column; }
    .hp-label { color: #ccc; font-size: 0.8rem; font-weight: 900; margin-bottom: 4px; text-shadow: 1px 1px 0 #000; letter-spacing: 1px;}
    .hp-bar-bg { width: 100%; height: 20px; background: #333; border: 2px solid #000; transform: skewX(-20deg); overflow: hidden; position: relative;}
    .hp-fill { height: 100%; width: 100%; transition: width 0.1s ease-out; box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), inset 0 -2px 0 rgba(0,0,0,0.3); }
    
    #p1-fill { background: linear-gradient(90deg, #4caf50, #2e7d32); }
    #p2-fill { background: linear-gradient(90deg, #f44336, #c62828); }
    
    #timer { 
        width: 70px; text-align: center; color: #ffeb3b; font-weight: 900; font-size: 2.2rem; 
        font-family: monospace; text-shadow: 3px 3px 0 #000;
        background: #000; border-radius: 5px; line-height: 1; padding: 5px 0;
    }

    #canvas-container {
        flex: 1; position: relative; background: #1a1a1a; overflow: hidden;
        /* Cyber Grid Background */
        background-image: 
            linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 50px 50px;
        box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
        display: flex; justify-content: center; align-items: center;
    }
    
    canvas { 
        background: transparent; 
        filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); 
        image-rendering: pixelated; 
    }

    #waiting-overlay {
        position: absolute; top:0; left:0; width:100%; height:100%;
        background: rgba(0,0,0,0.85); color: white;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 50; text-align: center; backdrop-filter: blur(5px);
    }

    /* CONTROLS OVERLAY (DYNAMIC LIBRARY) */
    #controls-layer {
        position: absolute; bottom: 20px; left: 0; width: 100%;
        height: 180px; pointer-events: none;
        display: flex; justify-content: space-between; align-items: flex-end;
        padding: 0 40px;
        z-index: 100;
    }
    #left-zone, #right-zone {
        width: 160px; height: 160px; pointer-events: auto;
        position: relative;
    }
    
    /* Dynamic Button Styles */
    .v-btn {
        position: absolute;
        border-radius: 50%;
        background: rgba(255,255,255,0.05);
        border: 2px solid rgba(255,255,255,0.2);
        box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        display: flex; align-items: center; justify-content: center;
        color: white; font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 1.4rem;
        backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        transition: transform 0.05s, background 0.05s, border-color 0.05s;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .v-btn:active, .v-btn.pressed { transform: scale(0.9); background: rgba(255,255,255,0.2); border-color: white; }
    
    /* Modern Controller Colors */
    .v-btn-a { background: linear-gradient(135deg, rgba(76, 175, 80, 0.4), rgba(27, 94, 32, 0.4)); border-color: #66bb6a; }
    .v-btn-b { background: linear-gradient(135deg, rgba(244, 67, 54, 0.4), rgba(183, 28, 28, 0.4)); border-color: #ef5350; }
    .v-btn-x { background: linear-gradient(135deg, rgba(33, 150, 243, 0.4), rgba(13, 71, 161, 0.4)); border-color: #42a5f5; }

    #reader { width: 100%; max-width: 300px; height: 250px; background: black; margin: 0 auto; border-radius: 10px; overflow: hidden; border: 2px solid var(--accent); }
    #html5-qrcode-anchor-scan-type-change { display: none !important; }
    #qr-container { background:white; padding:10px; border-radius:10px; border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; }

</style>
</head>
<body>

<!-- UI LAYER -->
<div id="ui-layer">
    <button id="btn-offline" onclick="SoundManager.init(); setupOfflineMode()">
        <i data-lucide="play-circle"></i> ОФЛАЙН ТЕСТ
    </button>
    
    <!-- MAIN MENU -->
    <div id="menu-main" class="card">
        <h1 style="font-weight:900; margin:0; line-height:0.9; font-size: 2.8rem; text-transform: uppercase; letter-spacing: -2px; color: #333;">
            Pixel<br><span style="color:var(--p2-color)">Brawler</span>
        </h1>
        <div style="width:100%; height:2px; background:#ddd; margin:10px 0;"></div>
        <div style="flex:1; width:100%; display:flex; flex-direction:column; gap:15px; justify-content:center;">
            <button class="role-btn role-host" onclick="SoundManager.init(); setupHost()">
                <i data-lucide="swords" width="48" height="48"></i> СТВОРИТИ ГРУ
            </button>
            <button class="role-btn role-join" onclick="SoundManager.init(); setupJoin()">
                <i data-lucide="gamepad-2" width="48" height="48"></i> ПРИЄДНАТИСЯ
            </button>
        </div>
    </div>

    <!-- HOST MENU -->
    <div id="menu-host" class="card hidden">
        <h3 style="margin:5px 0;">КІМНАТА ВЕДУЧОГО</h3>
        <div id="qr-container"></div>
        <div style="font-size: 1.8rem; font-weight:900; letter-spacing:3px; color:var(--accent); font-family: monospace;">
            <span id="host-id-display">...</span>
        </div>
        <div class="icon-btn-group" style="display:flex; gap:10px; width: 100%;">
            <button class="btn-secondary" onclick="copyId()"><i data-lucide="copy"></i> КОПІЯ</button>
            <button class="btn-secondary" onclick="shareGame()"><i data-lucide="share-2"></i> ПОДІЛИТИСЬ</button>
        </div>
        <button class="btn-secondary" onclick="location.reload()" style="margin-top:auto; background: #ffebee; color: #c62828;">ВІДМІНА</button>
    </div>

    <!-- JOIN MENU -->
    <div id="menu-join" class="card hidden">
        <h3 style="margin:5px 0;">КІМНАТА ГРАВЦЯ</h3>
        <!-- Rotary Lock -->
        <div id="lock-container">
            <div class="lock-group" id="input-group-1"></div> 
        </div>
        
        <button class="btn-secondary" style="margin-bottom: 10px;" onclick="pasteId()"><i data-lucide="clipboard"></i> ВСТАВИТИ ID</button>
        <button class="btn-primary" onclick="joinGameManually()">ПІДКЛЮЧИТИСЯ</button>
        
        <div style="width:100%; border-top:1px solid #ddd; margin:10px 0; padding-top:10px;">
            <div id="reader"></div>
        </div>
        <button class="btn-secondary" onclick="location.reload()">НАЗАД</button>
    </div>

    <div id="menu-loading" class="card hidden">
        <i data-lucide="loader-2" class="spin" style="width: 48px; height: 48px; color: var(--accent);"></i>
        <h3 id="loading-text">З'єднання...</h3>
    </div>
</div>

<!-- GAME LAYER -->
<div id="game-layer" class="hidden">
    <div id="hud">
        <div class="hp-box">
            <span class="hp-label">Г1 (ЗЕЛЕНИЙ)</span>
            <div class="hp-bar-bg"><div id="p1-fill" class="hp-fill"></div></div>
        </div>
        <div id="timer">60</div>
        <div class="hp-box" style="align-items: flex-end;">
            <span class="hp-label">Г2 (ЧЕРВОНИЙ)</span>
            <div class="hp-bar-bg"><div id="p2-fill" class="hp-fill"></div></div>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div id="waiting-overlay">
            <h2 id="wait-msg">ОЧІКУВАННЯ СУПЕРНИКА...</h2>
            <button id="rematch-btn" class="btn-primary hidden" style="width:200px; margin-top:20px;" onclick="requestRematch()">РЕВАНШ</button>
        </div>
    </div>

    <div id="controls-layer">
        <div id="left-zone"></div>
        <div id="right-zone"></div>
    </div>
</div>

<script>
    /* --- ADVANCED AUDIO MANAGER (TONE.JS) --- */
    const SoundManager = {
        isInit: false,
        bgm: null,
        kick: null,
        snare: null,
        bass: null,
        voiceSynth: null,
        fxReverb: null,
        fxDistortion: null,

        async init() {
            if (this.isInit) return;
            await Tone.start();
            Tone.Context.lookAhead = 0.05;

            // --- 1. EFFECTS CHAIN ---
            this.fxReverb = new Tone.Reverb({ decay: 1.5, preDelay: 0.01 }).toDestination();
            await this.fxReverb.generate();
            this.fxDistortion = new Tone.Distortion(0.4).toDestination();
            
            // --- 2. VOCAL SYNTH (Procedural "Voices") ---
            // Formant filter to simulate vowel sounds like "Hah!" and "Oof!"
            this.voiceSynth = new Tone.MonoSynth({
                oscillator: { type: "sawtooth" },
                envelope: { attack: 0.01, decay: 0.2, sustain: 0.0, release: 0.1 },
                filter: { type: "lowpass", frequency: 2000, Q: 1 },
                filterEnvelope: { attack: 0.001, decay: 0.1, baseFrequency: 200, octaves: 2, exponent: 2 }
            }).connect(this.fxReverb);
            this.voiceSynth.volume.value = -5;

            // --- 3. SFX SYNTHS (Cool Fighting Sounds) ---
            
            // Impact/Punch (Sub + Noise)
            this.punchSynth = new Tone.MembraneSynth({
                pitchDecay: 0.02, octaves: 4, oscillator: { type: "sine" },
                envelope: { attack: 0.001, decay: 0.2, sustain: 0, release: 0.1 }
            }).connect(this.fxDistortion);

            // Whoosh/Jump (Noise Sweep)
            this.whooshSynth = new Tone.NoiseSynth({
                noise: { type: 'pink' },
                envelope: { attack: 0.01, decay: 0.3, sustain: 0 }
            }).toDestination();
            this.whooshSynth.volume.value = -10;

            // Block/Metal
            this.metalSynth = new Tone.MetalSynth({
                harmonicity: 3.1, modulationIndex: 16, resonance: 4000,
                envelope: { attack: 0.001, decay: 0.1, release: 0.01 }, volume: -15
            }).toDestination();

            // --- 4. ACTION MUSIC (Cyberpunk Style) ---
            const drumVol = new Tone.Volume(-8).toDestination();
            
            this.kick = new Tone.MembraneSynth().connect(drumVol);
            this.snare = new Tone.NoiseSynth({ 
                noise: { type: 'white' }, 
                envelope: { attack: 0.001, decay: 0.2, sustain: 0 } 
            }).connect(this.fxReverb);

            this.bass = new Tone.FMSynth({
                harmonicity: 1, modulationIndex: 3.5,
                oscillator: { type: "sawtooth" },
                envelope: { attack: 0.01, decay: 0.3, sustain: 0.4, release: 0.2 },
                modulation: { type: "square" },
                modulationEnvelope: { attack: 0.1, decay: 0.2, sustain: 0.3, release: 0.01 }
            }).connect(this.fxDistortion);
            this.bass.volume.value = -12;

            // Sequence: Driving 130BPM Loop
            Tone.Transport.bpm.value = 130;
            
            const bassLoop = new Tone.Sequence((time, note) => {
                this.bass.triggerAttackRelease(note, "8n", time);
            }, ["C2", null, "C2", "C2", "F2", null, "G2", "Bb1"], "8n");

            const drumLoop = new Tone.Loop(time => {
                this.kick.triggerAttackRelease("C1", "8n", time);
                this.snare.triggerAttackRelease("8n", time + Tone.Time("4n"));
                this.kick.triggerAttackRelease("C1", "8n", time + Tone.Time("2n"));
                this.kick.triggerAttackRelease("C1", "8n", time + Tone.Time("2n") + Tone.Time("8n"));
                this.snare.triggerAttackRelease("8n", time + Tone.Time("2n") + Tone.Time("4n"));
            }, "1n");

            this.bgm = { start: () => { bassLoop.start(0); drumLoop.start(0); Tone.Transport.start(); }, 
                         stop: () => { Tone.Transport.stop(); } };

            this.bgm.start();
            this.isInit = true;
        },

        play(type) {
            if (!this.isInit) return;
            switch(type) {
                case 'jump': 
                    // Filter sweep for "Whoosh"
                    const filter = new Tone.Filter(800, "bandpass").toDestination();
                    const noise = new Tone.Noise("white").connect(filter);
                    noise.start();
                    filter.frequency.rampTo(2000, 0.2);
                    noise.stop("+0.2");
                    break;
                case 'land': 
                    this.punchSynth.triggerAttackRelease("A1", "32n"); 
                    break;
                case 'attack': 
                    // Shout "Hah!" + Swing
                    this.voiceSynth.triggerAttackRelease("E4", "16n"); 
                    this.whooshSynth.triggerAttackRelease("32n");
                    break;
                case 'hit': 
                    // Shout "Ugh!" + Heavy Impact
                    this.voiceSynth.triggerAttackRelease("G2", "8n"); 
                    this.punchSynth.triggerAttackRelease("C2", "16n");
                    break;
                case 'block': 
                    this.metalSynth.triggerAttackRelease("32n"); 
                    break;
                case 'win': 
                    this.bgm.stop();
                    const now = Tone.now();
                    const winSynth = new Tone.PolySynth(Tone.Synth).toDestination();
                    winSynth.triggerAttackRelease(["C4", "E4", "G4"], "8n", now);
                    winSynth.triggerAttackRelease(["C5", "E5", "G5"], "2n", now + 0.2);
                    break;
            }
        }
    };

    /* --- CONFIGURATION --- */
    const APP_PREFIX = "px_brawl_";
    const lockDigits = [0,0,0,0,0,0];
    let html5QrcodeScanner = null;
    
    // Game Constants
    const CANVAS_W = 800, CANVAS_H = 450;
    const GROUND_Y = 380;
    const PLAYER_W = 60, PLAYER_H = 100; 
    const GRAVITY = 0.8;
    const SPEED = 5;
    const CRAWL_SPEED = 2.5;
    const JUMP_FORCE = -16;
    const MAX_HP = 100;
    const ATTACK_COOLDOWN = 25;
    
    /* --- STATE --- */
    let peer, conn;
    let isHost = false, isOffline = false, isConnected = false;
    let myId = null;
    let gameLoopId;
    
    const inputs = {
        p1: { left: false, right: false, up: false, down: false, jump: false, block: false, atk: false },
        p2: { left: false, right: false, up: false, down: false, jump: false, block: false, atk: false }
    };
    
    let gameState = {
        time: 60,
        frameCount: 0,
        winner: null,
        p1: { x: 100, y: GROUND_Y, vx: 0, vy: 0, hp: MAX_HP, dir: 1, state: 'idle', cooldown: 0, ducking: false },
        p2: { x: 600, y: GROUND_Y, vx: 0, vy: 0, hp: MAX_HP, dir: -1, state: 'idle', cooldown: 0, ducking: false }
    };

    lucide.createIcons();

    /* --- ASSET GENERATOR (CANVAS) --- */
    class AssetGenerator {
        static createFighterSheet(color) {
            const cvs = document.createElement('canvas');
            const size = 64; 
            const cols = 5; const rows = 5; 
            cvs.width = size * cols; cvs.height = size * rows;
            const ctx = cvs.getContext('2d');
            
            const drawFrame = (row, col) => {
                const x = col * size; const y = row * size;
                const cx = x + size/2; const cy = y + size; 
                ctx.save();
                
                ctx.fillStyle = color; 
                // IDLE
                if (row === 0) {
                    const bob = (col % 2 === 0) ? 0 : 2;
                    ctx.fillRect(cx - 10, cy - 40 + bob, 20, 30);
                    ctx.fillStyle = '#ffccaa'; ctx.fillRect(cx - 8, cy - 54 + bob, 16, 14); // Skin
                    ctx.fillStyle = '#111'; ctx.fillRect(cx + 2, cy - 50 + bob, 4, 2); // Glasses
                    ctx.fillStyle = '#333'; ctx.fillRect(cx-9, cy-56+bob, 18, 5); // Hair
                }
                // RUN
                else if (row === 1) {
                    const lean = 5;
                    ctx.fillRect(cx - 10 + lean, cy - 40, 20, 28);
                    ctx.fillStyle = '#ffccaa'; ctx.fillRect(cx - 8 + lean, cy - 54, 16, 14);
                    ctx.fillStyle = '#333'; ctx.fillRect(cx-9+lean, cy-56, 18, 5); 
                    ctx.fillStyle = '#222'; // Pants
                    if (col % 4 === 0) { ctx.fillRect(cx-12, cy-12, 8, 12); ctx.fillRect(cx+4, cy-12, 8, 12); } 
                    else if (col % 4 === 1) { ctx.fillRect(cx-8, cy-15, 8, 10); ctx.fillRect(cx+8, cy-8, 8, 8); }
                    else { ctx.fillRect(cx+8, cy-12, 8, 12); ctx.fillRect(cx-12, cy-12, 8, 12); }
                }
                // JUMP
                else if (row === 2) {
                    ctx.fillRect(cx - 10, cy - 50, 20, 25); 
                    ctx.fillStyle = '#ffccaa'; ctx.fillRect(cx - 8, cy - 64, 16, 14); 
                    ctx.fillStyle = '#222'; ctx.fillRect(cx - 12, cy - 25, 10, 10); ctx.fillRect(cx + 2, cy - 20, 10, 8);
                }
                // DUCK
                else if (row === 3) {
                    ctx.fillRect(cx - 12, cy - 25, 24, 25);
                    ctx.fillStyle = '#ffccaa'; ctx.fillRect(cx - 8, cy - 39, 16, 14);
                    ctx.fillStyle = '#333'; ctx.fillRect(cx-9, cy-41, 18, 5); 
                }
                // ATTACK
                else if (row === 4) {
                    ctx.fillRect(cx - 10, cy - 40, 20, 30); 
                    ctx.fillStyle = '#ffccaa'; ctx.fillRect(cx - 8, cy - 54, 16, 14);
                    ctx.fillStyle = '#333'; ctx.fillRect(cx-9, cy-56, 18, 5); 
                    ctx.fillStyle = '#aa0000'; // Glove
                    const ext = (col > 0 && col < 3) ? 25 : 5;
                    ctx.fillRect(cx + 5, cy - 35, ext, 12); 
                }
                ctx.restore();
            };
            for(let r=0; r<rows; r++) for(let c=0; c<cols; c++) drawFrame(r, c);
            return cvs;
        }
    }

    class SpriteAnimator {
        constructor(color) {
            this.sheet = AssetGenerator.createFighterSheet(color);
            this.frameSize = 64;
            this.animations = {
                idle:   { row: 0, frames: 4, speed: 10 },
                run:    { row: 1, frames: 4, speed: 5 },
                jump:   { row: 2, frames: 1, speed: 1 },
                duck:   { row: 3, frames: 1, speed: 1 },
                crawl:  { row: 3, frames: 2, speed: 10 },
                attack: { row: 4, frames: 4, speed: 3 },
                stun:   { row: 0, frames: 1, speed: 1 }
            };
            this.currentAnim = 'idle';
            this.frameIndex = 0;
            this.tick = 0;
        }

        draw(ctx, x, y, w, h, dir, state, vx, ducking) {
            let key = 'idle';
            if (state === 'stun') key = 'stun';
            else if (state === 'attack') key = 'attack';
            else if (Math.abs(vx) > 0.1) key = ducking ? 'crawl' : 'run';
            else if (ducking) key = 'duck';
            else if (y < GROUND_Y) key = 'jump';

            if (key !== this.currentAnim) {
                this.currentAnim = key;
                this.frameIndex = 0;
                this.tick = 0;
            }

            const anim = this.animations[key];
            this.tick++;
            if (this.tick >= anim.speed) {
                this.tick = 0;
                this.frameIndex = (this.frameIndex + 1) % anim.frames;
            }

            const sx = this.frameIndex * this.frameSize;
            const sy = anim.row * this.frameSize;
            
            ctx.save();
            ctx.translate(x + w/2, y + h); 
            ctx.scale(dir, 1); 
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath(); ellipse(ctx, 0, 0, 24, 6); ctx.fill();

            const drawSize = 150; 
            ctx.drawImage(this.sheet, sx, sy, this.frameSize, this.frameSize, -drawSize/2, -drawSize + 10, drawSize, drawSize);
            ctx.restore();
        }
    }
    
    function ellipse(ctx, cx, cy, rx, ry){
        ctx.save(); ctx.beginPath(); ctx.translate(cx-rx, cy-ry);
        ctx.scale(rx, ry); ctx.arc(1, 1, 1, 0, 2 * Math.PI, false);
        ctx.restore();
    }

    const p1Sprite = new SpriteAnimator('#2e7d32');
    const p2Sprite = new SpriteAnimator('#c62828');

    /* --- INITIALIZATION --- */
    window.onload = () => {
        setupLockUI();
        const params = new URLSearchParams(window.location.search);
        if (params.get('host')) {
            hide('menu-main');
            show('menu-loading');
            connectToHost(params.get('host'));
        }
    };

    function show(id) { document.getElementById(id).classList.remove('hidden'); }
    function hide(id) { document.getElementById(id).classList.add('hidden'); }
    
    function setupLockUI() {
        const c = document.getElementById('lock-container');
        c.innerHTML = '';
        for(let i=0; i<6; i++) {
            const d = document.createElement('div');
            d.className = 'lock-roller';
            d.id = 'd'+i;
            d.innerText = '0';
            let startY = 0;
            d.addEventListener('touchstart', e => startY = e.touches[0].clientY);
            d.addEventListener('touchmove', e => {
                const diff = startY - e.touches[0].clientY;
                if(Math.abs(diff) > 20) {
                    changeDigit(i, diff > 0 ? 1 : -1);
                    startY = e.touches[0].clientY;
                }
            });
            d.addEventListener('click', () => changeDigit(i, 1));
            c.appendChild(d);
        }
    }

    function changeDigit(idx, dir) {
        lockDigits[idx] = (lockDigits[idx] + dir + 10) % 10;
        document.getElementById('d'+idx).innerText = lockDigits[idx];
    }
    
    function getCode() { return lockDigits.join(''); }

    /* --- NETWORKING SETUP --- */
    function setupHost() {
        isHost = true;
        myId = Math.floor(100000 + Math.random() * 900000).toString();
        hide('menu-main'); show('menu-host');
        document.getElementById('host-id-display').innerText = myId.replace(/(\d{3})(\d{3})/, "$1 $2");
        
        const fullUrl = window.location.href.split('?')[0] + '?host=' + myId;
        document.getElementById('qr-container').innerHTML = "";
        new QRCode(document.getElementById("qr-container"), { text: fullUrl, width: 200, height: 200, colorDark: "#000" });

        peer = new Peer(APP_PREFIX + myId);
        peer.on('open', () => console.log('Host Ready'));
        peer.on('connection', c => {
            if(conn) c.close();
            conn = c; setupConnection();
        });
    }

    function setupJoin() {
        isHost = false;
        hide('menu-main'); show('menu-join');
        setTimeout(() => {
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 200, height: 200 } }, false);
            html5QrcodeScanner.render(decoded => {
                let id = decoded;
                try { id = new URL(decoded).searchParams.get('host') || id; } catch(e){}
                handleCodeInput(id);
                html5QrcodeScanner.clear();
            }, ()=>{});
        }, 100);
    }
    
    function setupOfflineMode() {
        isOffline = true; isHost = true;
        hide('ui-layer'); show('game-layer');
        document.getElementById('wait-msg').style.display = 'none';
        initControls(); resizeCanvas(); startGame();
    }

    function joinGameManually() { handleCodeInput(getCode()); }

    function handleCodeInput(code) {
        if(!code || code.length < 6) return alert("Невірний ID");
        SoundManager.init();
        hide('menu-join'); show('menu-loading');
        connectToHost(code);
    }

    function connectToHost(id) {
        peer = new Peer();
        peer.on('open', () => {
            conn = peer.connect(APP_PREFIX + id, { reliable: true });
            setTimeout(() => { if(!isConnected) { alert("Ведучого не знайдено"); location.reload(); } }, 5000);
            setupConnection();
        });
    }
    
    async function shareGame() {
        const url = window.location.href.split('?')[0] + '?host=' + myId;
        if(navigator.share) try { await navigator.share({ title: 'Pixel Brawler', url }); } catch(e){}
        else copyId();
    }
    
    async function copyId() {
        const url = window.location.href.split('?')[0] + '?host=' + myId;
        await navigator.clipboard.writeText(url);
        alert("Скопійовано!");
    }
    async function pasteId() {
        try {
            const text = await navigator.clipboard.readText();
            let num = text.replace(/\D/g, '');
            if(text.includes('host=')) num = text.split('host=')[1].substring(0,6);
            if(num.length>=6) {
                for(let i=0; i<6; i++) { lockDigits[i]=parseInt(num[i]); document.getElementById('d'+i).innerText = num[i]; }
            }
        } catch(e){}
    }

    function setupConnection() {
        conn.on('open', () => {
            isConnected = true;
            hide('ui-layer'); show('game-layer');
            initControls(); resizeCanvas();
            if(isHost) startGame();
            else document.getElementById('wait-msg').style.display = 'none';
        });
        conn.on('data', data => {
            if(isHost) {
                if(data.type === 'INPUT') inputs.p2 = data.state;
                if(data.type === 'REMATCH') resetGame();
            } else {
                if(data.type === 'STATE') gameState = data.state;
            }
        });
        conn.on('close', () => location.reload());
    }

    /* --- GAME ENGINE --- */
    function initControls() {
        const stick = nipplejs.create({
            zone: document.getElementById('left-zone'),
            mode: 'static', position: { left: '50%', top: '50%' }, color: 'white', size: 100
        });
        
        stick.on('move', (e, data) => {
            const angle = data.angle.degree;
            if(data.force > 0.1) {
                const isUp = angle >= 45 && angle < 135;
                const isDown = angle >= 225 && angle < 315;
                const isLeft = angle >= 135 && angle < 225;
                const isRight = angle < 45 || angle >= 315;
                setInput('right', isRight); setInput('left', isLeft);
                setInput('up', isUp); setInput('down', isDown);
            }
        });
        stick.on('end', () => {
            setInput('right', false); setInput('left', false); setInput('up', false); setInput('down', false);
        });

        const btnZone = document.getElementById('right-zone');
        btnZone.innerHTML = '';
        const makeBtn = (txt, cls, x, y, act) => {
            const b = document.createElement('div');
            b.className = `v-btn ${cls}`; b.innerText = txt;
            b.style.width = '60px'; b.style.height = '60px';
            b.style.left = x+'px'; b.style.top = y+'px';
            const press = (s) => (e) => { e.preventDefault(); s ? b.classList.add('pressed') : b.classList.remove('pressed'); setInput(act, s); };
            b.addEventListener('touchstart', press(true)); b.addEventListener('touchend', press(false));
            b.addEventListener('mousedown', press(true)); b.addEventListener('mouseup', press(false));
            btnZone.appendChild(b);
        };
        makeBtn('A', 'v-btn-a', 50, 90, 'jump');
        makeBtn('B', 'v-btn-b', 100, 40, 'atk');
        makeBtn('X', 'v-btn-x', 0, 40, 'block');
    }

    function setInput(k, v) {
        if(isHost) inputs.p1[k] = v;
        else {
            const i = {...inputs.p2}; i[k]=v; inputs.p2[k]=v;
            if(!isOffline && conn && conn.open) conn.send({type:'INPUT', state:i});
        }
    }

    window.onkeydown = e => {
        const m = {ArrowLeft:'left', ArrowRight:'right', ArrowUp:'jump', ArrowDown:'down', z:'atk', x:'block'};
        if(m[e.key]) setInput(m[e.key], true);
    };
    window.onkeyup = e => {
        const m = {ArrowLeft:'left', ArrowRight:'right', ArrowUp:'jump', ArrowDown:'down', z:'atk', x:'block'};
        if(m[e.key]) setInput(m[e.key], false);
    };

    function startGame() {
        document.getElementById('wait-msg').style.display = 'none';
        if(gameLoopId) cancelAnimationFrame(gameLoopId);
        gameLoopId = requestAnimationFrame(loop);
    }
    
    function resetGame() {
        Object.assign(gameState, {
            time: 60, winner: null,
            p1: { x: 100, y: GROUND_Y, vx: 0, vy: 0, hp: MAX_HP, dir: 1, state: 'idle', ducking: false },
            p2: { x: 600, y: GROUND_Y, vx: 0, vy: 0, hp: MAX_HP, dir: -1, state: 'idle', ducking: false }
        });
        SoundManager.bgm.start();
        if(!isOffline) conn.send({type:'STATE', state:gameState});
    }

    function requestRematch() {
        if(isHost) resetGame();
        else conn.send({type:'REMATCH'});
        document.getElementById('rematch-btn').classList.add('hidden');
        document.getElementById('wait-msg').innerText = "";
    }

    function loop() {
        if(isHost && !gameState.winner) {
            if(gameState.frameCount++ % 60 === 0 && gameState.time > 0) gameState.time--;
            if(gameState.time <= 0) checkWin();
            
            updateP(gameState.p1, inputs.p1, gameState.p2);
            updateP(gameState.p2, inputs.p2, gameState.p1);
            
            if(!isOffline && conn && conn.open) conn.send({type:'STATE', state:gameState});
        }
        render(); updateHUD();
        
        if(gameState.winner && document.getElementById('waiting-overlay').style.display === 'none') {
            document.getElementById('waiting-overlay').style.display = 'flex';
            document.getElementById('wait-msg').innerText = gameState.winner;
            document.getElementById('rematch-btn').classList.remove('hidden');
        }
        requestAnimationFrame(loop);
    }

    function updateP(p, i, e) {
        if(p.state === 'stun') {
            if(Math.random() > 0.9) p.state = 'idle';
            return;
        }

        const isCrawl = i.down && p.y === GROUND_Y;
        const speed = isCrawl ? CRAWL_SPEED : SPEED;
        p.ducking = isCrawl;

        if(i.left) { p.vx = -speed; p.dir = -1; }
        else if(i.right) { p.vx = speed; p.dir = 1; }
        else p.vx = 0;

        if((i.jump || i.up) && p.y === GROUND_Y && !isCrawl) {
            p.vy = JUMP_FORCE;
            SoundManager.play('jump');
        }

        p.vy += GRAVITY; p.x += p.vx; p.y += p.vy;
        
        if(p.y > GROUND_Y) { 
            if(p.vy > 2) SoundManager.play('land');
            p.y = GROUND_Y; p.vy = 0; 
        }
        if(p.x < 0) p.x = 0; if(p.x > CANVAS_W - PLAYER_W) p.x = CANVAS_W - PLAYER_W;

        if(p.cooldown > 0) p.cooldown--;
        if(i.atk && p.cooldown === 0 && !isCrawl) {
            p.state = 'attack'; p.cooldown = ATTACK_COOLDOWN;
            SoundManager.play('attack');
            
            if(Math.abs(p.x - e.x) < 90 && Math.abs(p.y - e.y) < 50 && ((p.x<e.x && p.dir===1)||(p.x>e.x && p.dir===-1))) {
                if(inputs[e===gameState.p1?'p1':'p2'].block) {
                     e.hp -= 2; e.vx = p.dir*5;
                     SoundManager.play('block');
                } else {
                     e.hp -= 8; e.state = 'stun'; e.vy = -4; e.vx = p.dir*8;
                     SoundManager.play('hit');
                }
            }
        } else if(p.cooldown < ATTACK_COOLDOWN-10 && p.state === 'attack') p.state = 'idle';
        
        if(i.block) p.state = 'block';
        else if(p.state === 'block') p.state = 'idle';
        
        if(p.hp <= 0) checkWin();
    }

    function checkWin() {
        SoundManager.play('win');
        if(gameState.p1.hp <= 0 && gameState.p2.hp <= 0) gameState.winner = "НІЧИЯ";
        else if(gameState.p1.hp <= 0) gameState.winner = "ПЕРЕМІГ ГРАВЕЦЬ 2";
        else if(gameState.p2.hp <= 0) gameState.winner = "ПЕРЕМІГ ГРАВЕЦЬ 1";
        else if(gameState.time === 0) gameState.winner = (gameState.p1.hp > gameState.p2.hp) ? "ПЕРЕМІГ ГРАВЕЦЬ 1" : "ПЕРЕМІГ ГРАВЕЦЬ 2";
    }

    const cvs = document.getElementById('gameCanvas');
    const ctx = cvs.getContext('2d');
    
    function resizeCanvas() {
        const c = document.getElementById('canvas-container');
        const s = Math.min(c.clientWidth/CANVAS_W, c.clientHeight/CANVAS_H);
        cvs.style.width = (CANVAS_W*s)+'px'; cvs.style.height = (CANVAS_H*s)+'px';
    }
    window.onresize = resizeCanvas;

    function render() {
        ctx.clearRect(0,0,CANVAS_W,CANVAS_H);
        
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(0, GROUND_Y, CANVAS_W, CANVAS_H - GROUND_Y);
        ctx.fillStyle = '#333';
        ctx.fillRect(0, GROUND_Y, CANVAS_W, 10);

        p1Sprite.draw(ctx, gameState.p1.x, gameState.p1.y, PLAYER_W, PLAYER_H, gameState.p1.dir, gameState.p1.state, gameState.p1.vx, gameState.p1.ducking);
        p2Sprite.draw(ctx, gameState.p2.x, gameState.p2.y, PLAYER_W, PLAYER_H, gameState.p2.dir, gameState.p2.state, gameState.p2.vx, gameState.p2.ducking);
    }

    function updateHUD() {
        document.getElementById('p1-fill').style.width = Math.max(0, (gameState.p1.hp/MAX_HP)*100)+'%';
        document.getElementById('p2-fill').style.width = Math.max(0, (gameState.p2.hp/MAX_HP)*100)+'%';
        document.getElementById('timer').innerText = gameState.time;
    }
</script>
</body>
